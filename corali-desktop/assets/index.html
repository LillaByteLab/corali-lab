<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'"><title>Coralì Lab · PC</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><button class="brand" id="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#387F8A"/><rect x="8" y="8" width="10" height="10" rx="3" fill="#BFA2E6"/><rect x="22" y="8" width="10" height="10" rx="3" fill="#F07B6E"/><rect x="8" y="22" width="10" height="10" rx="3" fill="#F07B6E"/><rect x="22" y="22" width="10" height="10" rx="3" fill="#BFA2E6"/></svg><span>Coralì <b class="lab">Lab</b><small>IL TUO LABORATORIO DIGITALE</small></span></button><button class="round" id="add" aria-label="Importa file">＋</button></header>
<aside id="operationError" class="panel hidden" role="alert" style="margin:20px 36px"><strong>Operazione non completata</strong><p id="operationErrorText"></p></aside><main id="app" aria-live="polite"></main>
<nav aria-label="Navigazione"><button data-nav="home" class="active"><span>⌂</span>Inizio</button><button data-nav="files"><span>▤</span>I miei file</button><button data-nav="results"><span>✓</span>Risultati</button><button data-nav="about"><span>ⓘ</span>Info</button></nav>

<div id="toast" role="alert"></div>
<dialog id="picker"><div class="dialoghead"><h2>Scegli i file</h2><button id="closePicker" class="round" aria-label="Chiudi">×</button></div><p class="muted">L'app lavora su copie dei file importati.</p><button id="importPicker" class="secondary wide">＋ Importa dal PC</button><div id="pickList"></div><button id="confirmPicker" class="primary wide">Usa i file selezionati</button></dialog>
<script src="desktop.js"></script><script src="app.js"></script></body></html>
