<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'"><title>Coralì Lab · CSV</title><link rel="stylesheet" href="csv.css"><script src="/desktop.js" defer></script><script src="csv.js" defer></script><link rel="stylesheet" href="../assistant-widget.css"></head><body>
<header><button id="back">‹ Inizio</button><div><strong>Coralì Lab <span>CSV</span></strong><small id="name"></small></div><button id="save" class="primary">Salva copia</button></header>
<section class="toolbar"><label>Separatore di lettura<select id="delimiter"><option value=";">Punto e virgola ;</option><option value=",">Virgola ,</option><option value="&#9;">Tabulazione</option><option value="|">Barra |</option></select></label><label>Codifica della copia<select id="encoding"><option value="utf-8">UTF-8</option><option value="utf-8-sig">UTF-8 con BOM</option><option value="cp1252">Windows 1252</option><option value="utf-16">UTF-16</option></select></label><button id="addRow">＋ Riga</button><button id="addColumn">＋ Colonna</button><button id="undo">Annulla modifiche della pagina</button></section>
<p class="note">I valori rimangono testo: zeri iniziali, date e numeri non vengono convertiti automaticamente. I CSV non calcolano formule.</p><div id="message" role="status"></div>
<main><table id="table" aria-label="Dati CSV modificabili"></table></main><footer><button id="previous">←</button><span id="count"></span><button id="next">→</button><span class="spacer"></span><button id="export" hidden>Salva sul PC</button><button id="reveal" hidden>Mostra cartella</button></footer>
<dialog id="unsaved"><h2>Hai modifiche non salvate</h2><p>Salva una copia per conservarle.</p><button id="continue">Continua a modificare</button><button id="saveClose" class="primary">Salva ed esci</button><button id="discard">Esci senza salvare</button></dialog>
</body></html>
